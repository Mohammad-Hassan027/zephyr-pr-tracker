name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Installation & Hermetic Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies (Constrained Lockfile Installation)
        run: npm --prefix backend ci

      - name: Backend Security & Dependency Audit
        run: npm --prefix backend audit --audit-level=high
        continue-on-error: true

      - name: Run Backend Hermetic Test Suite
        run: npm --prefix backend test
        env:
          AUTH_SECRET: "ci-test-auth-secret-string-at-least-32-chars-long!"
          PLATFORM_ADMIN_PASSWORD: "ci-platform-admin-test-password"
          NODE_ENV: "test"

  frontend-check:
    name: Frontend Type-Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (Constrained Lockfile Installation)
        run: npm --prefix frontend ci

      - name: Frontend Security & Dependency Audit
        run: npm --prefix frontend audit --audit-level=high
        continue-on-error: true

      - name: Frontend Type-Check
        run: npm --prefix frontend run type-check

      - name: Frontend Production Build
        run: npm --prefix frontend run build
