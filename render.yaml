# ==============================================================================
# CANONICAL DEPLOYMENT BLUEPRINT: Zephyr Backend (Render)
# ==============================================================================
# This file is the CANONICAL infrastructure-as-code deployment definition for the
# Zephyr backend service. All production deployment behavior, build commands,
# startup commands, health check probes, and environment variable requirements
# are authoritatively defined in this blueprint.
#
# Frontend deployment is hosted separately on Vercel (see frontend/.env.production.example).
# For compatibility/legacy PaaS process definitions, see `Procfile` (compatibility-only).
# ==============================================================================

services:
  - type: web
    name: zephyr-backend
    runtime: node
    region: oregon
    plan: free
    healthCheckPath: /healthz
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      # node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: AUTH_SECRET
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: EMAIL_PROVIDER
        value: nodemailer

      - key: EMAIL_FROM
        value: Zephyr Events <noreply@zephyr.local>

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SECURE
        value: "false"
